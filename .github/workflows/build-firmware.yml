name: Build MeshCore firmware (Catalunya)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch o tag de meshcore-dev/MeshCore a compilar"
        default: "main"
  schedule:
    - cron: "0 5 * * 1" # cada lunes 05:00 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: waveshare_rp2040_lora_repeater
            name: rp2040-waveshare-repeater
            adv: RP2040-Cat
          - env: GAT562_30S_Mesh_Kit_repeater
            name: gat562-30s-repeater
            adv: GAT562-Cat
          - env: ProMicro_repeater
            name: e22p-nrf52840-repeater
            adv: E22P-Cat
          - env: Heltec_v3_repeater
            name: heltec-v3-repeater
            adv: HeltecV3-Cat
          - env: t1000e_companion_radio_ble
            name: t1000e-companion
          - env: Heltec_t114_repeater
            name: heltec-t114-repeater
            adv: T114-Cat
          - env: heltec_v4_repeater
            name: heltec-v4-repeater
            adv: HeltecV4-Cat
            flash: 16MB
          - env: RAK_4631_repeater
            name: rak4631-repeater
            adv: RAK4631-Cat
          - env: RAK_4631_companion_radio_ble
            name: rak4631-companion
          - env: Xiao_nrf52_repeater
            name: xiao-nrf52-repeater
            adv: XiaoNRF-Cat
          - env: Xiao_nrf52_companion_radio_ble
            name: xiao-nrf52-companion
          - env: Xiao_S3_WIO_repeater
            name: xiao-s3-repeater
            adv: XiaoS3-Cat
          - env: Xiao_S3_WIO_companion_radio_ble
            name: xiao-s3-companion
          - env: LilyGo_T-Echo_repeater
            name: techo-repeater
            adv: TEcho-Cat
          - env: LilyGo_T-Echo_companion_radio_ble
            name: techo-companion
          - env: Heltec_v3_companion_radio_ble
            name: heltec-v3-companion
          - env: heltec_v4_companion_radio_ble
            name: heltec-v4-companion
            flash: 16MB
          - env: Heltec_t114_companion_radio_ble
            name: heltec-t114-companion
          - env: GAT562_30S_Mesh_Kit_companion_radio_ble
            name: gat562-30s-companion
          - env: LilyGo_TDeck_companion_radio_ble
            name: tdeck-companion
            flash: 16MB
          - env: WioTrackerL1_repeater
            name: wio-tracker-l1-repeater
            adv: WioL1-Cat
          - env: WioTrackerL1_companion_radio_ble
            name: wio-tracker-l1-companion
          - env: ThinkNode_M1_repeater
            name: thinknode-m1-repeater
            adv: ThinkM1-Cat
          - env: ThinkNode_M1_companion_radio_ble
            name: thinknode-m1-companion
          - env: RAK_3401_repeater
            name: rak3401-repeater
            adv: RAK3401-Cat
          - env: RAK_3401_companion_radio_ble
            name: rak3401-companion
          - env: RAK_WisMesh_Tag_repeater
            name: wismesh-tag-repeater
            adv: WisTag-Cat
          - env: RAK_WisMesh_Tag_companion_radio_ble
            name: wismesh-tag-companion
    steps:
      - uses: actions/checkout@v4
        with:
          repository: meshcore-dev/MeshCore
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}

      - name: Instalar PlatformIO
        run: pip install platformio

      - name: Configuracio Catalunya
        if: matrix.adv != ''
        env:
          ENV_NAME: ${{ matrix.env }}
          ADV: ${{ matrix.adv }}
        run: |
          python3 - <<'PYEOF'
          import glob, os, re, sys
          env = os.environ["ENV_NAME"]
          adv = os.environ["ADV"]
          flags = ("-D LORA_FREQ=869.618 -D LORA_BW=62.5 "
                   "-D LORA_SF=7 -D LORA_CR=6 "
                   "-D ADVERT_NAME='\"%s\"'" % adv)
          header = "[env:%s]" % env
          for path in glob.glob("**/platformio.ini", recursive=True):
              if ".pio" in path.split(os.sep):
                  continue
              lines = open(path, encoding="utf-8").read().split("\n")
              starts = [i for i, l in enumerate(lines) if l.strip() == header]
              if not starts:
                  continue
              i = starts[0] + 1
              while i < len(lines) and not lines[i].startswith("[") and not re.match(r"build_flags\s*=", lines[i]):
                  i += 1
              if i >= len(lines) or lines[i].startswith("["):
                  sys.exit("L'entorn %s no te build_flags propi a %s" % (env, path))
              j = i + 1
              while j < len(lines) and lines[j].strip() and (lines[j][0] in " \t;#"):
                  j += 1
              lines.insert(j, "  " + flags)
              open(path, "w", encoding="utf-8").write("\n".join(lines))
              print("Configurat", env, "a", path)
              break
          else:
              sys.exit("No trobo l'entorn " + env)
          PYEOF
          git diff | tail -15
      - name: Compilar ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      - name: Recoger ficheros
        run: |
          set -e
          B=".pio/build/${{ matrix.env }}"
          N="${{ matrix.name }}"
          VER="$(git describe --tags --always | sed -E 's/^[A-Za-z_-]+-v/v/')"
          mkdir -p out
          ls -la "$B"

          # RP2040 / algunos nRF52: UF2 directo
          if [ -f "$B/firmware.uf2" ]; then
            cp "$B/firmware.uf2" "out/$N-$VER.uf2"
          fi

          # nRF52840: si no hay UF2, convertir el .hex (family 0xADA52840)
          if [ ! -f "out/$N-$VER.uf2" ] && [ -f "$B/firmware.hex" ]; then
            curl -sSLO https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py
            curl -sSLO https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2families.json
            python uf2conv.py "$B/firmware.hex" -c -f 0xADA52840 -o "out/$N-$VER.uf2"
          fi

          # nRF52: paquete DFU para OTA por Bluetooth
          if [ -f "$B/firmware.zip" ]; then
            cp "$B/firmware.zip" "out/$N-$VER-ota-dfu.zip"
          fi

          # ESP32 (sin UF2): .bin para OTA por WiFi y .merged para flashear de cero
          if [ ! -f "out/$N-$VER.uf2" ] && [ -f "$B/firmware.bin" ]; then
            [ "${N#*companion}" != "$N" ] || cp "$B/firmware.bin" "out/$N-$VER-ota.bin"
            if [ ! -f "$B/firmware-merged.bin" ] && [ -f "$B/bootloader.bin" ] && [ -f "$B/partitions.bin" ]; then
              pip install esptool
              BOOT_APP0="$(find "$HOME/.platformio/packages" -name boot_app0.bin | head -1)"
              python -m esptool --chip esp32s3 merge_bin -o "$B/firmware-merged.bin" \
                --flash_mode dio --flash_size ${{ matrix.flash || '8MB' }} \
                0x0 "$B/bootloader.bin" 0x8000 "$B/partitions.bin" \
                0xe000 "$BOOT_APP0" 0x10000 "$B/firmware.bin"
            else
              echo "AVISO: faltan bootloader.bin o partitions.bin, no se genera el merged"
            fi
            if [ -f "$B/firmware-merged.bin" ]; then
              cp "$B/firmware-merged.bin" "out/$N-$VER-merged.bin"
            fi
          fi

          ls -la out
          test -n "$(ls -A out)"
      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.name }}
          path: out/*

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fw-*
          merge-multiple: true
          path: dist

      - name: Sumas SHA256 y fecha
        id: meta
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: fw-${{ steps.meta.outputs.date }}
          name: Firmwares MeshCore Catalunya ${{ steps.meta.outputs.date }}
          body: |
            Repetidors MeshCore compilats de meshcore-dev/MeshCore (${{ inputs.ref || 'main' }}).
            Verifica els fitxers amb SHA256SUMS.txt.
          files: dist/*
          make_latest: true# reindex
